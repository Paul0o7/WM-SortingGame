<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#024731">
<title>Sort It Right</title>
<style>
:root{
  --deep:#024731; --green:#00693C; --gold:#EBAB00;
  --blue:#1B6FB5; --blue-d:#12508A;
  --grn:#4C9A2A;  --grn-d:#35701C;
  --gry:#5A5F5E;  --gry-d:#3E4342;
  --ink:#16261F; --soft:#4E5A54; --sky:#BFE6F5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--sky);
  overflow:hidden;overscroll-behavior:none;
}
#park{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;height:100dvh;max-width:720px;margin:0 auto;
  display:flex;flex-direction:column}

header{background:var(--deep);flex:none;border-bottom:3px solid #013A28;position:relative;z-index:60;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  display:flex;align-items:center;gap:10px}
header img{height:clamp(26px,7vw,34px);width:auto;display:block;flex:none}
.tools{display:flex;gap:5px}
.tool{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.13);color:#fff;font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.tool:hover{background:rgba(255,255,255,.26)}
.tool:active{transform:scale(.9)}
.tool.off{opacity:.42}
.hud{margin-left:auto;display:flex;gap:clamp(8px,3vw,16px)}
.stat{text-align:right;line-height:1.05}
.stat b{display:block;font-size:clamp(15px,4.6vw,20px);color:#fff;font-weight:800;
  font-variant-numeric:tabular-nums}
.stat span{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:#7FA394;font-weight:700}
.stat.best b{color:var(--gold)}
.pop{animation:pop .42s cubic-bezier(.34,1.8,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
#bar{height:5px;background:rgba(1,58,40,.35);flex:none;position:relative;z-index:60}
#bar i{display:block;height:100%;width:0;background:var(--gold);
  transition:width .5s cubic-bezier(.2,.8,.2,1)}

main{flex:1;display:flex;flex-direction:column;padding:6px 12px 0;min-height:0}
#tray{flex:1;display:flex;align-items:center;justify-content:center;min-height:100px}
#card{background:#fff;border:4px solid #fff;border-radius:26px;
  padding:clamp(12px,3.4vw,20px) clamp(18px,5vw,30px);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  min-width:clamp(150px,50vw,210px);
  box-shadow:0 8px 0 rgba(2,71,49,.16),0 14px 26px rgba(2,71,49,.18);
  cursor:grab;touch-action:none;user-select:none;will-change:transform;
  --dx:0px;--dy:0px;--dx1:0px;--dy1:0px;--dx2:0px;--dy2:0px}
#card.drop{animation:drop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{0%{transform:translateY(-110px) scale(.6) rotate(-12deg);opacity:0}
  100%{transform:none;opacity:1}}
#card.idle{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
#card.good{border-color:var(--grn)}
#card.bad{border-color:#E4572E}
#card.toss{animation:toss .58s cubic-bezier(.32,.05,.4,1) forwards}
@keyframes toss{
  0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}
  28%{transform:translate(calc(var(--dx)*.4),calc(var(--dy)*.22 - 30px)) scale(.86) rotate(65deg);opacity:1}
  60%{transform:translate(calc(var(--dx)*.86),calc(var(--dy)*.68)) scale(.5) rotate(190deg);opacity:1}
  84%{transform:translate(calc(var(--dx)*.98),calc(var(--dy)*.95)) scale(.24) rotate(250deg);opacity:.85}
  100%{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(275deg);opacity:0}
}
/* wrong pick: fly into the chosen cart, bounce back out, then continue on
   into the correct one — both legs measured from the card's own start point,
   since a single element's transform keyframes are never additive */
#card.reject{animation:reject .95s cubic-bezier(.32,.05,.38,1) forwards}
@keyframes reject{
  0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}
  24%{transform:translate(calc(var(--dx1)*.42),calc(var(--dy1)*.24 - 26px)) scale(.85) rotate(55deg);opacity:1}
  42%{transform:translate(var(--dx1),calc(var(--dy1)*.88)) scale(.46) rotate(140deg);opacity:1}
  52%{transform:translate(calc(var(--dx1) - 10px),calc(var(--dy1)*.7)) scale(.52) rotate(160deg);opacity:1}
  74%{transform:translate(calc((var(--dx1) + var(--dx2))*.52),
      calc((var(--dy1) + var(--dy2))*.42 - 24px)) scale(.58) rotate(235deg);opacity:1}
  92%{transform:translate(calc(var(--dx2)*.98),calc(var(--dy2)*.96)) scale(.24) rotate(330deg);opacity:.85}
  100%{transform:translate(var(--dx2),var(--dy2)) scale(.1) rotate(350deg);opacity:0}
}
#emoji{font-size:clamp(34px,11vw,54px);line-height:1.1}
#name{font-size:clamp(14px,4.4vw,19px);font-weight:800;text-align:center;letter-spacing:-.01em}
#tip{font-size:clamp(9px,2.6vw,11px);color:var(--soft);font-weight:700}

#fb{flex:none;min-height:clamp(42px,8vh,60px);display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(8px) scale(.96);transition:opacity .2s,transform .2s}
#fb.on{opacity:1;transform:none}
#fb>div{background:rgba(255,255,255,.96);border-radius:16px;padding:7px 14px;max-width:46ch;
  text-align:center;font-size:clamp(11px,3vw,13px);line-height:1.4;font-weight:600;
  box-shadow:0 4px 0 rgba(2,71,49,.1)}
#fb b{display:block;font-size:clamp(12px,3.3vw,14px);font-weight:800;margin-bottom:1px}

#bins{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(4px,2vw,12px);
  padding:0 0 calc(env(safe-area-inset-bottom) + 8px)}
.bin{background:none;border:none;padding:0;font:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  transition:transform .2s cubic-bezier(.34,1.6,.6,1)}
.bin:focus-visible{outline:4px solid var(--gold);outline-offset:4px;border-radius:16px}
.cart{height:clamp(58px,17vh,150px);width:auto;max-width:100%;display:block;overflow:visible}
.lid{transform-box:fill-box;transform-origin:8% 90%;
  transition:transform .24s cubic-bezier(.34,1.6,.6,1)}
.bin:hover .lid{transform:rotate(-9deg)}
.bin.over{transform:translateY(-10px) scale(1.05)}
.bin.over .lid{transform:rotate(-13deg) translateY(-3px)}
.bin.gulp{animation:gulp .42s cubic-bezier(.34,1.7,.6,1)}
@keyframes gulp{0%{transform:scaleY(1)}35%{transform:scaleY(.88) scaleX(1.08)}100%{transform:scaleY(1)}}
.bin.nope{animation:nope .42s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}60%{transform:translateX(8px)}}
.tag{font-size:clamp(10px,3.2vw,14px);font-weight:800;color:#fff;padding:3px 10px;
  border-radius:999px;letter-spacing:-.01em;white-space:nowrap}
#b-recycle .tag{background:var(--blue-d)}
#b-organic .tag{background:var(--grn-d)}
#b-landfill .tag{background:var(--gry-d)}
.what{font-size:clamp(8px,2.3vw,10px);line-height:1.3;text-align:center;font-weight:700;
  color:#22352B;margin-top:2px;padding:0 2px}

canvas{position:fixed;inset:0;pointer-events:none;z-index:40}

.screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:24px 22px;text-align:center;
  background:#EDF8EC;overflow-y:auto}
.screen.hide{display:none}
.mark{height:clamp(40px,13vw,58px);width:auto}
.screen h1{font-size:clamp(26px,9vw,40px);line-height:1;color:var(--deep);font-weight:800;
  letter-spacing:-.02em}
.screen h1 em{font-style:normal;color:var(--gold)}
.screen p{font-size:clamp(12px,3.6vw,15px);color:var(--soft);line-height:1.55;max-width:36ch;
  font-weight:600}
.btn{background:var(--green);color:#fff;border:none;font:inherit;font-weight:800;
  font-size:clamp(14px,4.2vw,17px);padding:14px 34px;border-radius:999px;cursor:pointer;
  box-shadow:0 5px 0 #024A2B;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #024A2B}
.btn.gold{background:var(--gold);color:var(--deep);box-shadow:0 5px 0 #B98800}
.btn.gold:active{box-shadow:0 1px 0 #B98800}
.levels{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lv{border:3px solid #CFE0CE;background:#fff;color:var(--soft);font:inherit;
  font-size:clamp(11px,3.4vw,14px);font-weight:800;padding:9px 16px;border-radius:999px;
  cursor:pointer;transition:all .15s;line-height:1.15}
.lv small{display:block;font-size:9px;font-weight:700;opacity:.75}
.lv[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff}
#big{font-size:clamp(44px,15vw,66px);font-weight:800;color:var(--deep);letter-spacing:-.03em;
  line-height:1;font-variant-numeric:tabular-nums}
#grade{font-size:clamp(11px,3.4vw,14px);letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);font-weight:800}
#newbest{background:var(--gold);color:var(--deep);font-size:11px;font-weight:800;
  padding:4px 14px;border-radius:999px;letter-spacing:.1em;text-transform:uppercase}
.missed{width:100%;max-width:360px;text-align:left;background:#fff;border-radius:16px;
  padding:12px 14px;max-height:30vh;overflow-y:auto;box-shadow:0 4px 0 rgba(2,71,49,.1)}
.missed h3{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);
  font-weight:800;margin-bottom:7px}
.missed div{font-size:11.5px;line-height:1.4;padding:6px 0;border-top:2px solid #EEF4EC;font-weight:600}
.missed div:first-of-type{border-top:none}
.endrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{background:#fff;color:var(--green);border:3px solid var(--green);font:inherit;
  font-weight:800;font-size:clamp(12px,3.6vw,15px);padding:11px 24px;border-radius:999px;cursor:pointer}

@media (max-height:640px){.what{display:none}#tip{display:none}.screen{gap:8px}}
@media (max-height:520px){
  #card{padding:8px 16px;border-radius:18px;gap:1px}
  #emoji{font-size:clamp(22px,7vh,34px)}
  #name{font-size:clamp(12px,3vh,16px)}
  #tray{min-height:60px}
  main{padding:4px 10px 0}
  .tag{padding:2px 8px}
  header{padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:4px}
}
@media (min-width:600px){#bins{gap:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<svg id="park" viewBox="0 0 400 700" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <rect width="400" height="700" fill="#BFE6F5"/>
  <circle cx="335" cy="95" r="52" fill="#FFD84D" opacity=".28"/>
  <circle cx="335" cy="95" r="38" fill="#FFD84D"/>
  <g fill="#fff" opacity=".92">
    <ellipse cx="70" cy="120" rx="38" ry="20"/><ellipse cx="98" cy="112" rx="28" ry="17"/>
    <ellipse cx="240" cy="70" rx="30" ry="15"/><ellipse cx="262" cy="64" rx="22" ry="13"/>
  </g>
  <path d="M0 470 Q70 400 150 450 Q230 500 300 440 Q360 392 400 430 L400 700 L0 700 Z" fill="#8FD07A"/>
  <path d="M0 520 Q100 470 200 515 Q300 560 400 505 L400 700 L0 700 Z" fill="#6FBF57"/>
  <g><rect x="46" y="452" width="11" height="46" rx="4" fill="#8A5A34"/>
    <circle cx="51" cy="440" r="32" fill="#4C9A2A"/><circle cx="30" cy="452" r="22" fill="#57A833"/>
    <circle cx="72" cy="452" r="22" fill="#57A833"/></g>
  <g><rect x="336" y="432" width="9" height="40" rx="4" fill="#8A5A34"/>
    <circle cx="340" cy="422" r="26" fill="#4C9A2A"/><circle cx="323" cy="432" r="18" fill="#57A833"/>
    <circle cx="357" cy="432" r="18" fill="#57A833"/></g>
  <rect x="0" y="560" width="400" height="140" fill="#5BB047"/>
  <g fill="#4C9A2A" opacity=".55">
    <ellipse cx="60" cy="600" rx="34" ry="9"/><ellipse cx="200" cy="640" rx="46" ry="11"/>
    <ellipse cx="340" cy="596" rx="30" ry="8"/>
  </g>
</svg>

<div id="app">
  <header>
    <img src="wm-logo.svg" alt="WM">
    <div class="tools">
      <button class="tool" id="home" aria-label="Back to menu" title="Menu">&#9776;</button>
      <button class="tool" id="music" aria-label="Background music" title="Music">&#9835;</button>
      <button class="tool" id="mute" aria-label="Mute sound effects" title="Sound effects">&#9834;</button>
    </div>
    <div class="hud">
      <div class="stat"><b id="score">0</b><span>Score</span></div>
      <div class="stat"><b id="streak">0</b><span>Streak</span></div>
      <div class="stat best"><b id="bestnum">0</b><span>Best</span></div>
    </div>
  </header>
  <div id="bar"><i id="fill"></i></div>

  <main>
    <div id="tray">
      <div id="card">
        <div id="emoji"></div>
        <div id="name"></div>
        <div id="tip">Drag me to a cart</div>
      </div>
    </div>

    <div id="fb"><div></div></div>

    <div id="bins">
      <button class="bin" id="b-recycle" data-bin="recycle" aria-label="Blue cart, recycling">
        <svg class="cart" viewBox="0 0 120 152">
          <g class="lid"><rect x="5" y="12" width="110" height="15" rx="7" fill="#12508A"/>
          <rect x="13" y="25" width="94" height="6" rx="3" fill="#0E4271"/></g>
          <path d="M14 31 H106 L99 124 Q98 133 89 133 H31 Q22 133 21 124 Z" fill="#1B6FB5"/>
          <path d="M14 31 H32 L27 133 H31 Q22 133 21 124 Z" fill="#2A82CA" opacity=".55"/>
          <rect x="46" y="58" width="28" height="8" rx="4" fill="#0E4271"/>
          <circle cx="33" cy="138" r="11" fill="#2B2F2E"/><circle cx="87" cy="138" r="11" fill="#2B2F2E"/>
          <circle cx="33" cy="138" r="4" fill="#5A5F5E"/><circle cx="87" cy="138" r="4" fill="#5A5F5E"/>
        </svg>
        <span class="tag">Recycling</span>
        <span class="what">Paper, cardboard, glass, cans, bottles</span>
      </button>

      <button class="bin" id="b-organic" data-bin="organic" aria-label="Green cart, organics">
        <svg class="cart" viewBox="0 0 120 152">
          <g class="lid"><rect x="5" y="12" width="110" height="15" rx="7" fill="#35701C"/>
          <rect x="13" y="25" width="94" height="6" rx="3" fill="#2A5A15"/></g>
          <path d="M14 31 H106 L99 124 Q98 133 89 133 H31 Q22 133 21 124 Z" fill="#4C9A2A"/>
          <path d="M14 31 H32 L27 133 H31 Q22 133 21 124 Z" fill="#5FB338" opacity=".55"/>
          <rect x="46" y="58" width="28" height="8" rx="4" fill="#2A5A15"/>
          <circle cx="33" cy="138" r="11" fill="#2B2F2E"/><circle cx="87" cy="138" r="11" fill="#2B2F2E"/>
          <circle cx="33" cy="138" r="4" fill="#5A5F5E"/><circle cx="87" cy="138" r="4" fill="#5A5F5E"/>
        </svg>
        <span class="tag">Organics</span>
        <span class="what">Food scraps, yard waste, soiled paper</span>
      </button>

      <button class="bin" id="b-landfill" data-bin="landfill" aria-label="Grey cart, landfill">
        <svg class="cart" viewBox="0 0 120 152">
          <g class="lid"><rect x="5" y="12" width="110" height="15" rx="7" fill="#3E4342"/>
          <rect x="13" y="25" width="94" height="6" rx="3" fill="#2F3433"/></g>
          <path d="M14 31 H106 L99 124 Q98 133 89 133 H31 Q22 133 21 124 Z" fill="#5A5F5E"/>
          <path d="M14 31 H32 L27 133 H31 Q22 133 21 124 Z" fill="#6E7472" opacity=".55"/>
          <rect x="46" y="58" width="28" height="8" rx="4" fill="#2F3433"/>
          <circle cx="33" cy="138" r="11" fill="#2B2F2E"/><circle cx="87" cy="138" r="11" fill="#2B2F2E"/>
          <circle cx="33" cy="138" r="4" fill="#8A8F8D"/><circle cx="87" cy="138" r="4" fill="#8A8F8D"/>
        </svg>
        <span class="tag">Landfill</span>
        <span class="what">Film plastic, foam, diapers, ceramics</span>
      </button>
    </div>
  </main>

  <div class="screen" id="start">
    <img src="wm-logo.svg" alt="WM" class="mark">
    <h1>Sort it <em>right</em></h1>
    <p>Three carts. One item at a time. Find out how much you really know about where your waste goes.</p>
    <div class="levels" role="group" aria-label="Choose a level">
      <button class="lv" data-lv="kids" aria-pressed="false">Kids<small id="bk">best 0</small></button>
      <button class="lv" data-lv="standard" aria-pressed="true">Standard<small id="bs">best 0</small></button>
      <button class="lv" data-lv="expert" aria-pressed="false">Expert<small id="be">best 0</small></button>
    </div>
    <button class="btn" id="go">Start sorting</button>
  </div>

  <div class="screen hide" id="end">
    <img src="wm-logo.svg" alt="WM" class="mark">
    <div id="newbest" hidden>New best score</div>
    <div id="grade"></div>
    <div id="big"></div>
    <p id="endmsg"></p>
    <div class="missed" id="missed" hidden></div>
    <div class="endrow">
      <button class="btn gold" id="again">Play again</button>
      <button class="ghost" id="menu">Change level</button>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
const ITEMS=[
{e:"\u{1F34C}",n:"Banana peel",b:"organic",lv:1,w:"Food scraps become compost. In a landfill they make methane instead."},
{e:"\u{1F34E}",n:"Apple core",b:"organic",lv:1,w:"Cores, peels and pits all go green."},
{e:"\u{1F95A}",n:"Eggshells",b:"organic",lv:1,w:"Shells add calcium to the finished compost."},
{e:"\u{1F957}",n:"Leftover salad",b:"organic",lv:1,w:"All food waste goes green, cooked or raw."},
{e:"\u{1F33F}",n:"Yard trimmings",b:"organic",lv:1,w:"Yard waste is the heaviest part of the organics stream."},
{e:"\u{1F35E}",n:"Stale bread",b:"organic",lv:1,w:"Bread, grains and pasta all compost."},
{e:"\u{1F4F0}",n:"Newspaper",b:"recycle",lv:1,w:"Keep paper dry. Wet fiber breaks apart and gets rejected."},
{e:"\u{1F4E6}",n:"Cardboard box",b:"recycle",lv:1,w:"Flatten it first so it does not jam the truck."},
{e:"\u{1FAD9}",n:"Glass jar",b:"recycle",lv:1,w:"Rinse it. Glass recycles forever without losing quality."},
{e:"\u{1F96B}",n:"Metal food can",b:"recycle",lv:1,w:"Magnets pull steel off the line automatically. Give it a rinse."},
{e:"\u{1F9F4}",n:"Shampoo bottle",b:"recycle",lv:1,w:"Rigid plastic bottles are accepted. Empty it, cap back on."},
{e:"\u{1F9C3}",n:"Juice box",b:"recycle",lv:1,w:"Most programs take cartons now. Empty and flatten them."},
{e:"\u{1F6CD}\uFE0F",n:"Plastic grocery bag",b:"landfill",lv:1,w:"Film plastic tangles the sorting machines. Use store drop-off bins."},
{e:"\u{1F964}",n:"Foam drink cup",b:"landfill",lv:1,w:"Polystyrene foam has almost no recycling market anywhere."},
{e:"\u{1F476}",n:"Disposable diaper",b:"landfill",lv:1,w:"Mixed materials plus contamination. Landfill only."},
{e:"\u{1F9FD}",n:"Kitchen sponge",b:"landfill",lv:1,w:"Synthetic foam with food residue. Neither other cart can take it."},

{e:"\u{1F355}",n:"Greasy pizza box",b:"organic",lv:2,w:"Grease ruins paper recycling, but the fiber composts fine."},
{e:"\u{1F9FB}",n:"Used paper towel",b:"organic",lv:2,w:"Food-soiled paper belongs with organics, never with recycling."},
{e:"\u{1FAD8}",n:"Coffee grounds",b:"organic",lv:2,w:"Grounds and the paper filter go green together."},
{e:"\u{1FAB5}",n:"Untreated wood scraps",b:"organic",lv:2,w:"Clean wood composts. Painted or pressure-treated wood does not."},
{e:"\u{1FAB4}",n:"Dead houseplant",b:"organic",lv:2,w:"Plant and soil both go green. The plastic pot does not."},
{e:"\u{1F95C}",n:"Peanut shells",b:"organic",lv:2,w:"Nut shells compost. One of the easiest organics wins."},
{e:"\u{1F9B4}",n:"Chicken bones",b:"organic",lv:2,w:"Bones go green in commercial composting, unlike backyard piles."},
{e:"\u{1F9C0}",n:"Cheese rind",b:"organic",lv:2,w:"Dairy is fine in commercial organics collection."},
{e:"\u{1F9C8}",n:"Butter tub",b:"recycle",lv:2,w:"Rigid tubs are usually accepted. Rinse it, lid off."},
{e:"\u{1F4D3}",n:"Spiral notebook",b:"recycle",lv:2,w:"Pull the metal spiral out first, then the paper recycles."},
{e:"\u{2615}",n:"Lined coffee cup",b:"landfill",lv:2,w:"The plastic lining stops it pulping. Lid and sleeve may recycle separately."},
{e:"\u{1F375}",n:"Broken ceramic mug",b:"landfill",lv:2,w:"Ceramic melts at a different temperature than glass and ruins the batch."},
{e:"\u{1F36C}",n:"Candy wrapper",b:"landfill",lv:2,w:"Foil bonded to plastic cannot be separated at the facility."},
{e:"\u{1F9E6}",n:"Worn-out socks",b:"landfill",lv:2,w:"Textiles wrap around the sorting equipment. Use a textile drop-off."},
{e:"\u{1FAA3}",n:"Plastic bucket",b:"landfill",lv:2,w:"Too large and rigid for the line. Reuse it or find a rigid plastic drop-off."},

{e:"\u{1F9FE}",n:"Glossy receipt",b:"landfill",lv:3,w:"Thermal paper carries BPA and contaminates recycled pulp."},
{e:"\u{1FAA5}",n:"Toothbrush",b:"landfill",lv:3,w:"Nylon bristles fused to plastic. Too small and too mixed to sort."},
{e:"\u{1F4C4}",n:"Shredded paper",b:"landfill",lv:3,w:"Short fibers fall through the screens. Compost it if your program allows."},
{e:"\u{1F374}",n:"Compostable plastic fork",b:"landfill",lv:3,w:"It only breaks down at industrial facilities. Most areas cannot process it."},
{e:"\u{1FAE7}",n:"Bubble wrap",b:"landfill",lv:3,w:"Another film plastic. Same problem as grocery bags."},
{e:"\u{1F455}",n:"Old cotton t-shirt",b:"landfill",lv:3,w:"Textiles jam the line. Donate it or use a textile drop-off."},
{e:"\u{1F45F}",n:"Worn-out sneakers",b:"landfill",lv:3,w:"Glued rubber, foam and fabric. Some brands run take-back programs."},
{e:"\u{1F9F8}",n:"Teddy bear",b:"landfill",lv:3,w:"Stuffed toys are mixed textiles. Donate it if it is still in good shape."},
{e:"\u{1F529}",n:"Loose screws",b:"landfill",lv:3,w:"Metal, but too small to catch. Collect scrap metal separately instead."},
{e:"\u{1F9CB}",n:"Bubble tea cup",b:"landfill",lv:3,w:"Plastic cup, sealed film lid and a wide straw. All three are problems."},
{e:"\u{1F961}",n:"Paper takeout box",b:"organic",lv:3,w:"Food residue rules out blue, but the fiber composts."},
{e:"\u{1F9C1}",n:"Cupcake liner",b:"organic",lv:3,w:"Greasy paper liners go green, not blue."},
{e:"\u{1F344}",n:"Mushroom stems",b:"organic",lv:3,w:"Trimmings and stems are all compostable."},
{e:"\u{1F9C5}",n:"Onion skins",b:"organic",lv:3,w:"Papery skins break down quickly."},
{e:"\u{1F33D}",n:"Corn cob",b:"organic",lv:3,w:"Cobs and husks compost, though cobs take longer."},
{e:"\u{1F954}",n:"Potato peels",b:"organic",lv:3,w:"Peels are classic organics. They should never reach the grey cart."},
{e:"\u{1F4DA}",n:"Paperback book",b:"recycle",lv:3,w:"Paperbacks recycle whole. Hardcovers need the binding removed first."},
{e:"\u{1F5DE}\uFE0F",n:"Junk mail",b:"recycle",lv:3,w:"Paper recycles, windowed envelopes included. Plastic-wrapped catalogs do not."},
{e:"\u{1F95B}",n:"Glass milk bottle",b:"recycle",lv:3,w:"Returnable bottles are better reused, but glass always beats the grey cart."}
];

const LABEL={recycle:"the blue cart",organic:"the green cart",landfill:"the grey cart"};
const LEN={kids:10,standard:14,expert:16};
const KEY="wmSortBest_v1";

let level="standard",queue=[],at=0,score=0,streak=0,best=0,locked=true,missed=[];
let sfx=true,trackIdx=0;

const $=i=>document.getElementById(i);
const card=$("card"),bins=[...document.querySelectorAll(".bin")];

function loadBests(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function saveBest(lv,v){try{const b=loadBests();b[lv]=v;localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}}
function paintBests(){
  const b=loadBests();
  $("bk").textContent="best "+(b.kids||0);
  $("bs").textContent="best "+(b.standard||0);
  $("be").textContent="best "+(b.expert||0);
  $("bestnum").textContent=b[level]||0;
}

let ac=null;
function ctx(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(ac.state==="suspended")ac.resume();
  return ac;
}
function play(f,wave,vol,dur){
  if(!f)return;
  const a=ctx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=wave;o.frequency.value=f;
  g.gain.setValueAtTime(0,a.currentTime);
  g.gain.linearRampToValueAtTime(vol,a.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+.02);
}
function beep(f,d,wave,vol){if(sfx)play(f,wave||"sine",vol||.09,d)}
const win=()=>{beep(659,.09);setTimeout(()=>beep(880,.15),85)};
const lose=()=>beep(146,.26,"square",.07);

const C3=130.81,F3=174.61,G3=196,C4=261.63,D4=293.66,E4=329.63,G4=392,A4=440,C5=523.25;
const TRACKS=[
 {name:"Off"},
 {name:"Sunny",bpm:118,wave:"triangle",vol:.035,
  mel:[C5,G4,A4,G4,E4,G4,A4,C5,E4,G4,A4,C5,A4,G4,E4,D4],
  bass:[C3,null,null,null,G3,null,null,null,C3,null,null,null,F3,null,null,null]},
 {name:"Breezy",bpm:84,wave:"sine",vol:.042,
  mel:[E4,null,G4,null,A4,null,G4,null,D4,null,E4,null,G4,null,null,null],
  bass:[C3,null,null,null,null,null,null,null,G3,null,null,null,null,null,null,null]},
 {name:"Parade",bpm:132,wave:"square",vol:.022,
  mel:[C4,C4,G4,G4,A4,A4,G4,null,E4,E4,D4,D4,C4,null,G4,null],
  bass:[C3,null,C3,null,G3,null,G3,null,C3,null,C3,null,G3,null,G3,null]}
];
let musicTimer=null,step=0;
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){
  stopMusic();
  const t=TRACKS[trackIdx];
  if(!t||!t.mel||!ctx())return;
  step=0;
  const ms=(60/t.bpm)*1000/2;
  musicTimer=setInterval(()=>{
    const i=step%16;
    play(t.mel[i],t.wave,t.vol,ms/1000*1.6);
    play(t.bass[i],"sine",t.vol*1.3,ms/1000*3);
    step++;
  },ms);
}

const cv=$("fx"),cx=cv.getContext("2d");
let parts=[],raf=null;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
size();addEventListener("resize",size);
const PARTY=["#EBAB00","#00693C","#1B6FB5","#ffffff","#4C9A2A"];
function burst(x,y,cols){
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*8;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:3+Math.random()*5,
      c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.5,life:1});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.013;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
    cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;
    cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;
  [a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  if(level==="kids")return shuffle(ITEMS.filter(x=>x.lv===1)).slice(0,LEN.kids);
  if(level==="standard")return shuffle(ITEMS.filter(x=>x.lv<=2)).slice(0,LEN.standard);
  const hard=shuffle(ITEMS.filter(x=>x.lv===3)),mid=shuffle(ITEMS.filter(x=>x.lv===2));
  return shuffle(hard.slice(0,10).concat(mid.slice(0,6)));
}
function load(){
  const it=queue[at];
  $("emoji").textContent=it.e;
  $("name").textContent=it.n;
  card.className="";void card.offsetWidth;card.classList.add("drop");
  card.style.transform="";card.style.opacity="1";
  $("fb").classList.remove("on");
  $("fill").style.width=(at/queue.length*100)+"%";
  locked=false;
  setTimeout(()=>{card.classList.remove("drop");if(!locked&&!drag)card.classList.add("idle")},640);
}
function bump(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}

function answer(bin){
  if(locked)return;
  locked=true;
  card.classList.remove("idle","drop");
  bins.forEach(b=>b.classList.remove("over"));
  const it=queue[at],right=bin===it.b,hit=$("b-"+bin),target=$("b-"+it.b);

  /* Reset any drag transform BEFORE measuring or animating. The toss/reject
     keyframes always start their 0% frame at transform:none (the card's
     resting layout position) — if we don't clear the drag transform first,
     the element visually snaps back to rest the instant the animation
     class is applied, while our distance math would still be based on
     wherever it was dragged to. Resetting first keeps both in sync. */
  card.style.transform="";
  const cr=card.getBoundingClientRect();
  const fromX=cr.left+cr.width/2,fromY=cr.top+cr.height/2;

  const r1=hit.getBoundingClientRect();
  const toX1=r1.left+r1.width/2,toY1=r1.top+r1.height*0.3;
  card.style.setProperty("--dx",(toX1-fromX)+"px");
  card.style.setProperty("--dy",(toY1-fromY)+"px");

  if(right){
    score+=10+Math.min(streak,5)*2;streak++;best=Math.max(best,streak);
    card.classList.add("good","toss");
    hit.classList.add("gulp");setTimeout(()=>hit.classList.remove("gulp"),460);
    setTimeout(()=>burst(toX1,toY1,PARTY),330);
    win();
    $("fb").firstElementChild.innerHTML="<b style='color:#35701C'>Correct</b>"+it.w;
  }else{
    streak=0;missed.push(it);
    /* second leg: from the same start point, on to the correct cart */
    const r2=target.getBoundingClientRect();
    const toX2=r2.left+r2.width/2,toY2=r2.top+r2.height*0.3;
    card.style.setProperty("--dx1",(toX1-fromX)+"px");
    card.style.setProperty("--dy1",(toY1-fromY)+"px");
    card.style.setProperty("--dx2",(toX2-fromX)+"px");
    card.style.setProperty("--dy2",(toY2-fromY)+"px");
    card.classList.add("bad","reject");

    setTimeout(lose,220);
    setTimeout(()=>{hit.classList.add("nope");setTimeout(()=>hit.classList.remove("nope"),420)},400);
    setTimeout(()=>target.classList.add("over"),480);
    setTimeout(()=>{
      target.classList.add("gulp");
      setTimeout(()=>target.classList.remove("gulp"),420);
      setTimeout(()=>target.classList.remove("over"),500);
    },870);
    $("fb").firstElementChild.innerHTML="<b style='color:#C63D17'>Goes in "+LABEL[it.b]+"</b>"+it.w;
  }
  $("fb").classList.add("on");
  bump($("score"));bump($("streak"));
  $("score").textContent=score;$("streak").textContent=streak;
  setTimeout(()=>{at++;at>=queue.length?finish():load()},right?1500:2700);
}

let drag=false,sx=0,sy=0;
card.addEventListener("pointerdown",e=>{
  if(locked)return;
  drag=true;sx=e.clientX;sy=e.clientY;
  card.classList.remove("idle","drop");
  card.style.transform="";
  card.setPointerCapture(e.pointerId);
  card.style.cursor="grabbing";card.style.transition="none";
});
card.addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  card.style.transform="translate("+dx+"px,"+dy+"px) rotate("
    +Math.max(-12,Math.min(12,dx/12))+"deg) scale(1.08)";
  const o=binAt(e.clientX,e.clientY);
  bins.forEach(b=>b.classList.toggle("over",b===o));
});
card.addEventListener("pointerup",e=>{
  if(!drag)return;
  drag=false;card.style.cursor="grab";card.style.transition="";
  const o=binAt(e.clientX,e.clientY);
  if(o){answer(o.dataset.bin)}
  else{card.style.transform="";card.classList.add("idle");bins.forEach(b=>b.classList.remove("over"))}
});
card.addEventListener("pointercancel",()=>{drag=false;card.style.transform="";
  card.style.transition="";bins.forEach(b=>b.classList.remove("over"))});
function binAt(x,y){
  for(const b of bins){const r=b.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top-18&&y<=r.bottom)return b}
  return null;
}
bins.forEach(b=>b.addEventListener("click",()=>{if(!drag)answer(b.dataset.bin)}));
addEventListener("keydown",e=>{
  if(!$("start").classList.contains("hide"))return;
  const m={"1":"recycle","2":"organic","3":"landfill"};
  if(m[e.key])answer(m[e.key]);
});

document.querySelectorAll(".lv").forEach(b=>b.addEventListener("click",()=>{
  level=b.dataset.lv;
  document.querySelectorAll(".lv").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  paintBests();
}));
function toMenu(){
  locked=true;stopMusic();
  $("fb").classList.remove("on");
  $("end").classList.add("hide");
  $("start").classList.remove("hide");
  paintBests();
}
function start(){
  queue=build();at=0;score=0;streak=0;best=0;missed=[];
  $("score").textContent=0;$("streak").textContent=0;
  paintBests();
  $("start").classList.add("hide");$("end").classList.add("hide");
  load();
  if(trackIdx>0)startMusic();
}
$("go").addEventListener("click",()=>{ctx();beep(523,.08);start()});
$("again").addEventListener("click",start);
$("menu").addEventListener("click",toMenu);
$("home").addEventListener("click",toMenu);
$("mute").addEventListener("click",()=>{
  sfx=!sfx;
  $("mute").classList.toggle("off",!sfx);
  $("mute").setAttribute("aria-label",sfx?"Mute sound effects":"Unmute sound effects");
});
$("music").addEventListener("click",()=>{
  ctx();
  trackIdx=(trackIdx+1)%TRACKS.length;
  const t=TRACKS[trackIdx];
  $("music").classList.toggle("off",trackIdx===0);
  $("music").title="Music: "+t.name;
  $("music").setAttribute("aria-label","Background music: "+t.name);
  if(trackIdx===0){stopMusic()}else{startMusic()}
});

function finish(){
  locked=true;
  $("fill").style.width="100%";
  const correct=queue.length-missed.length;
  const prev=loadBests()[level]||0;
  const isBest=score>prev;
  if(isBest)saveBest(level,score);
  $("newbest").hidden=!isBest;
  $("big").textContent=score;
  $("grade").textContent=correct===queue.length?"Perfect run"
    :correct/queue.length>=.8?"Sorting pro"
    :correct/queue.length>=.6?"Getting there":"Keep practicing";
  $("endmsg").textContent=correct+" of "+queue.length+" sorted correctly. Longest streak: "
    +best+(isBest?"":". Your best is "+prev+".");
  const m=$("missed");
  if(missed.length){
    m.hidden=false;
    m.innerHTML="<h3>Worth remembering</h3>"+missed.map(x=>
      "<div><b>"+x.e+" "+x.n+"</b> &rarr; "+LABEL[x.b]+"<br>"+x.w+"</div>").join("");
  }else{m.hidden=true;m.innerHTML=""}
  $("end").classList.remove("hide");
  paintBests();
  if(correct===queue.length||isBest){
    burst(innerWidth/2,innerHeight/3,PARTY);
    setTimeout(()=>burst(innerWidth/3,innerHeight/2.4,PARTY),220);
    setTimeout(()=>burst(innerWidth/1.5,innerHeight/2.6,PARTY),400);
  }
}

$("music").classList.add("off");
paintBests();
</script>
</body>
</html>
